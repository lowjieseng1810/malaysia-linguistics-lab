{% extends "base.html" %}

        <p>Welcome back, <strong>{{ session.username }}</strong>! You are logged in.</p>
    {% else %}
        <p>Welcome! Please <a href="{{ url_for('login') }}">login</a> or
           <a href="{{ url_for('register') }}">register</a> to get started.</p>
    {% endif %}
{% endblock %}
