{% extends "base.html" %}

{% block title %}
Login | Malaysia Linguistics Lab
{% endblock %}

{% block page_css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}

<div class="login-page">
<div class="login-panel">

    <span class="login-brand">Malaysia Linguistics Lab</span>
    <h2>Login</h2>


    <!-- NORMAL USERNAME / PASSWORD LOGIN -->

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <div class="mb-3">

            <label
                for="username"
                class="form-label"
            >
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                autocomplete="username"
                maxlength="30"
                required
            >

        </div>


        <div class="mb-3">

            <label
                for="loginPassword"
                class="form-label"
            >
                Password
            </label>

            <div class="password-field-wrap">

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    class="form-control"
                    autocomplete="current-password"
                    maxlength="128"
                    required
                >

                <button
                    type="button"
                    class="show-password-button"
                    id="showPasswordButton"
                    aria-label="Show password"
                >
                    Show
                </button>

            </div>

        </div>


        <div class="forgot-password-row">

            <a href="{{ url_for('forgot_password') }}">
                Forgot password?
            </a>

        </div>

        <button
            type="submit"
            class="btn btn-login"
        >
            Login
        </button>

    </form>


    <!-- DIVIDER -->

    <div
        class="login-divider"
        aria-hidden="true"
    >

        <span>
            OR
        </span>

    </div>


    <!-- GOOGLE LOGIN -->

    <a
        href="{{ url_for('google_login') }}"
        class="google-login-button"
    >

        <span
            class="google-login-icon-wrap"
            aria-hidden="true"
        >

            <svg
                class="google-login-icon"
                viewBox="0 0 24 24"
            >

                <path
                    fill="#4285F4"
                    d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.41z"
                >
                </path>

                <path
                    fill="#34A853"
                    d="M12 22c2.7 0 4.97-.9 6.62-2.36l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.62A10 10 0 0 0 12 22z"
                >
                </path>

                <path
                    fill="#FBBC05"
                    d="M6.39 13.93A6.02 6.02 0 0 1 6.08 12c0-.67.11-1.32.31-1.93V7.45H3.04A10 10 0 0 0 2 12c0 1.61.39 3.14 1.04 4.55l3.35-2.62z"
                >
                </path>

                <path
                    fill="#EA4335"
                    d="M12 5.94c1.47 0 2.79.5 3.83 1.5l2.87-2.87C16.96 2.95 14.7 2 12 2a10 10 0 0 0-8.96 5.45l3.35 2.62C7.18 7.7 9.39 5.94 12 5.94z"
                >
                </path>

            </svg>

        </span>


        <span class="google-login-text">
            Continue with Google
        </span>

    </a>


    <!-- REGISTER -->

    <p class="login-register-text">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register here
        </a>.

    </p>

</div>
</div>


<script>

const loginPassword =
    document.getElementById("loginPassword");

const showPasswordButton =
    document.getElementById("showPasswordButton");


showPasswordButton.addEventListener(
    "click",
    function () {

        const passwordIsHidden =
            loginPassword.type === "password";

        loginPassword.type =
            passwordIsHidden
                ? "text"
                : "password";

        showPasswordButton.textContent =
            passwordIsHidden
                ? "Hide"
                : "Show";

        showPasswordButton.setAttribute(
            "aria-label",
            passwordIsHidden
                ? "Hide password"
                : "Show password"
        );

    }
);

</script>

{% endblock %}
