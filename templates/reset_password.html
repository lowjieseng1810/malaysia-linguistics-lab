{% extends "base.html" %}

{% block title %}
Reset Password | Malaysian Linguistics Lab
{% endblock %}

{% block content %}

<h2>Reset Password</h2>

<p class="mt-3" style="max-width: 500px;">
    Choose a new password for your account.
</p>

<form
    method="POST"
    class="mt-3"
    style="max-width: 400px;"
    id="resetPasswordForm"
>

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >


    <div class="mb-3">

        <label
            for="password"
            class="form-label"
        >
            New Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
        >

    </div>


    <div class="mb-3">

        <label
            for="confirm_password"
            class="form-label"
        >
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            class="form-control"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
        >

        <div
            id="passwordMismatch"
            class="text-warning mt-2"
            style="display: none;"
        >
            Passwords do not match.
        </div>

    </div>


    <div class="form-check mb-3">

        <input
            type="checkbox"
            class="form-check-input"
            id="showPasswords"
        >

        <label
            class="form-check-label"
            for="showPasswords"
        >
            Show passwords
        </label>

    </div>


    <button
        type="submit"
        class="btn btn-primary"
    >
        Reset Password
    </button>

</form>


<script>

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirm_password");

const showPasswordsCheckbox =
    document.getElementById("showPasswords");

const resetPasswordForm =
    document.getElementById("resetPasswordForm");

const passwordMismatch =
    document.getElementById("passwordMismatch");


showPasswordsCheckbox.addEventListener(
    "change",
    function () {

        const inputType =
            this.checked
                ? "text"
                : "password";

        passwordInput.type = inputType;

        confirmPasswordInput.type = inputType;

    }
);


resetPasswordForm.addEventListener(
    "submit",
    function (event) {

        if (
            passwordInput.value !==
            confirmPasswordInput.value
        ) {

            event.preventDefault();

            passwordMismatch.style.display =
                "block";

            confirmPasswordInput.focus();

            return;
        }

        passwordMismatch.style.display =
            "none";

    }
);

</script>

{% endblock %}
