{% extends "base.html" %}

{% block title %}{{ status_code }} — Malaysian Linguistics Lab{% endblock %}

{% block content %}

<style>
.error-state{
  text-align:center;
  padding:80px 20px;
  max-width:560px;
  margin:0 auto;
}

.error-state .error-code{
  font-size:.85rem;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#efd77e;
  margin-bottom:14px;
}

.error-state h1{
  font-size:1.6rem;
  color:#fff;
  margin-bottom:12px;
}

.error-state p{
  color:var(--muted);
  font-size:.95rem;
  margin-bottom:26px;
}

.error-state .error-actions{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.error-state .error-actions a{
  padding:11px 20px;
  border-radius:12px;
  border:1px solid rgba(217,180,74,.4);
  background:rgba(217,180,74,.14);
  color:#efd77e;
  font-size:.88rem;
  font-weight:650;
  text-decoration:none;
}

.error-state .error-actions a:hover{
  background:rgba(217,180,74,.24);
}
</style>

<div class="card error-state">
  <div class="error-code">Error {{ status_code }}</div>
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  <div class="error-actions">
    {% if session.username %}
    <a href="{{ url_for('dashboard') }}">Back to dashboard</a>
    {% else %}
    <a href="{{ url_for('home') }}">Back to home</a>
    {% endif %}
  </div>
</div>

{% endblock %}
